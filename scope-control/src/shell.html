,"B":1200,"C":225,"Hmax":5000,"Omax":null},"bt":225,"bl":50}}},"projectList":{"_rule":"The Projects screen (approved design A, 21-Nov-2026): one panel per project, then the places not in use, each with Add project. The program has one project for now; spare = how many places not in use show. A plate reads slot, the number and the name (PROJECT 01 · NAME); a place not in use reads empty (words approved 22-Nov-2026; before: +P01, SPARE).","spare":2,"slot":"Project","empty":"Empty","template":"Project_status_template.xlsx","_keys":"The keys of the Projects page and of the Add project window (the key of Home: a coloured line, a symbol, a name, in a box; approved by Omar 22-Nov-2026, before: round buttons with a name plate). A project that is not the open one reads switch in place of open. add is also the title of the window.","keys":{"open":"Open","switch":"Switch","settings":"Settings","add":"Add project","template":"Template","load":"Load Excel"}},"layout":{"_rule":"Home is drawn for this width; on a wider screen (or zoomed out) it scales as one panel, so it looks the same at any zoom (option B, approved by Omar 21-Nov-2026). Narrower screens keep their own layouts.","homeWidth":1520,"_sections":"The three sections of Home, in order. A plate reads its number and name (01 · PROJECT CONTROLS); the menus of EDIT HOME name a section the same way. The words are the ones of the site and the project, not of a control room (option A, approved by Omar 22-Nov-2026; before: +H01 Incomer, +H02 HMI & Annunciator, +H03 Scope metering & log). modules = the parts of Home by their names: a block that shows a title shows this one.","sections":{"c1":"Project controls","c2":"Site layout & alerts","c3":"Progress & log"},"_keys":"The keys of section 01, in one box (design A, approved by Omar 22-Nov-2026): the look of the page keys – a coloured line, a symbol, a name – without the red line. The line says the colour of a key and, on Edit mode and Night, whether it is on. Online backups shows to an administrator, as a seventh key across the bottom. The box is one part of Home (modules.ctl); before, the round buttons, the two switches and the three lights were five parts.","keys":{"load":"Load sheet","export":"Export sheet","backup":"Backup","search":"Search","edit":"Edit mode","theme":"Night","online":"Online backups"},"modules":{"st":"Status sheet","ctl":"Tools","wk":"7-day progress","an":"Alerts","log":"Updates log","hmi":"Site layout"}},"measured":{"_rule":"Measured works register (Reports · Commercial): record types and units. Stored keys of types never change (records keep them).","types":{"var":"Variation","abo":"Abortive","idle":"Idle","scope":"Original scope"},"units":["m³","m²","m","no.","bar-days","days","LS"]},"touch":{"_rule":"One rule for every pointer (Omar, 22-Nov-2026: on a phone a touched key stayed lit after the finger lifted). A look written for :hover shows only to a pointer that can hover (hover = the media condition the build puts around it); the same look, and every :active look, shows while a thing is pressed (.prs) and goes when the pointer lifts. The build writes both from the style files (build.js, pointerRule), so no style is written for touch by hand; src/js/38-press.js sets .prs on the thing under a pressed pointer and on what holds it. On a touch screen the look waits 'wait' ms, so a finger that starts a scroll lights nothing; a tap shorter than that still flashes for 'min' ms; a slide of more than 'slop' px, a scroll or a cancelled touch ends it at once. The look comes on at once and leaves with the element's own transition.","hover":"(hover:hover) and (pointer:fine)","wait":70,"min":110,"slop":10},"alerts":{"_rule":"The lines of the Alerts screen of Home, in the order of importance, and their words (Omar, 23-Nov-2026: the sentences had many signs such as > and /; say the meaning without signs). A name is plain words: letters, figures and the decimal point, nothing else. The group of a line is in the program (critical: clash, xut, lvl, far · follow-up: short, thru, noop, tight, seq · info: orph, shlo, unl · then Decisions, named in pages.dec). short and shlo are the pipes that stop short of their pit, by 0.5 m or more and by less. noop counts a pipe at a wall with no opening in the schedule and a pipe of another size than its opening. tight and seq were one line with one count: a crossing with less than the clear distance and work done out of sequence are different things, each has its line. unl was called Open ends: it counts ends that stop near a pit without being linked to it; the open ends of the network check report (no pit near) are not on Home.","lines":{"clash":"Clash with other network","xut":"Linked to other network","lvl":"Level clash","far":"Linked to a far pit","short":"Short by 0.5 m or more","thru":"Passes through a pit","noop":"Opening does not match","tight":"Tight crossing","seq":"Out of sequence","orph":"Pipe not drawn","shlo":"Short by less than 0.5 m","unl":"End not linked to a pit"}},"pixels":{"_rule":"Nothing the program draws is coarser than the screen it is on (Omar, 23-Nov-2026: pixelation is forbidden). Words, lines, lights, keys and meters are shapes the browser draws, sharp at any size. A picture the program makes itself – the layout and its layers, the snapshot of the site layout on Home, the key plan, a 3D model – is made with the screen's own pixels for every point it covers. That number is read in one place, corePx() in runtime, and the pictures are made again when it changes (zoom of the browser, another monitor: corePxWatch tells them); where Home is enlarged on a wide screen the snapshot counts that too. A module never types its own number. keep = the least pixels for a point of a picture that is kept or leaves the screen (the Home snapshot, a printed sheet, a saved section picture), so that it prints well from a plain screen: corePx(true). Pictures that come as files – drawing pages, thumbnails, photos, satellite imagery – have the pixels of their file. While the layout moves, its last picture is shown for the frames of the move and the layout is drawn again when it stops. tests/pixels.js checks the rule.","keep":2},"drawingUpdate":{"_rule":"Corrections read from the AQ-DA drawings, applied to the data file at start-up before anything reads it (src/js/00-core-state-helpers.js). A line is written only where two independent sources agree, or where the CAD file itself names the tag of an outline the PDF could not read. It changes only what the drawing decides: which outline a tag sits on, and the outline size its quantities use. A status and the status sheet's own figures are never changed, and what the team saves on the layout (a position, a shape) still wins. size = the duct bank's quantities use its own outline on the layout; swap = two duct banks sit on each other's outlines and take each other's place; cycle = three duct banks in a ring, each takes the outline of the next one in the line (named in the log as a swap); outline = a duct bank with no outline gets the one its arrow ends on in the drawing, its four corners written in the line; tag = an unclear-tag outline is the outline of the tag the drawing names: the tag takes it (outline, point, area, size) and the unclear item is gone. The trench link of a place moves with its outline. Every corrected tag has a line in the Updates log, in the log on Home and in its own history, beside what people saved and never in its place: who = the source, kind = what changed (by the word of its line), date = the day of the correction. closes = for a kind of line, the list of the drawing audit that it answers: the tags of the line leave that list. A project added on the device is not touched.","who":"AQ-DA drawings","kind":{"size":"Outline size (m)","swap":"Outline exchanged (m)","outline":"Outline added (m)","tag":"Unclear tag named"},"closes":{"swap":"Check: arrow disagrees with outline","outline":"Moved to the arrow, no outline found","tag":"Tag not clear: set the real tag"},"date":"2026-11-23","list":[["size","MM5100790U-EYL-DB-022"],["size","MM5100790U-IY-DB-630"],["size","MM5100790U-EY-DB-048"],["size","MM5100790U-EY-DB-510"],["size","MM5100790U-EYL-DB-039"],["size","MM5100790U-EYL-DB-086"],["size","MM5100790U-IY-DB-083"],["size","MM5100790U-EG-DB-014"],["size","MM5100790U-EY-DB-011"],["size","MM5100790U-IY-DB-096"],["size","MM5100790U-EY-DB-530"],["size","MM5100790U-EYL-DB-091"],["size","MM5100790U-EYL-DB-013"],["swap","MM5100790U-IY-DB-028","MM5100790U-EYL-DB-054"],["swap","MM5100790U-EY-DB-504","MM5100790U-IY-DB-270"],["cycle","MM5100790U-IY-DB-126","MM5100790U-EY-DB-050","MM5100790U-IY-DB-135"],["outline","MM5100790U-EG-DB-040",[[3886.411,1252.507],[3894.811,1266.651],[3894.424,1266.881],[3886.024,1252.737]]],["outline","MM5100790U-EY-DB-061",[[4060.425,1382.065],[4059.523,1382.737],[4048.398,1367.807],[4049.3,1367.135]]],["outline","MM5100790U-EY-DB-062",[[4048.408,1366.023],[4060.885,1353.677],[4061.677,1354.477],[4049.2,1366.823]]],["outline","MM5100790U-EYL-DB-089",[[4683.262,1356.7],[4683.937,1356.7],[4683.937,1359.388],[4683.262,1359.388]]],["outline","MM5100790U-EYL-DB-101",[[6374.962,1931.808],[6375.637,1931.808],[6375.637,1936.9],[6374.962,1936.9]]],["outline","MM5100790U-IY-DB-061",[[4628.416,1155.95],[4654.299,1155.95],[4654.299,1156.85],[4628.416,1156.85]]],["outline","MM5100790U-IY-DB-207",[[8059.856,1696.6],[8068.066,1696.6],[8068.066,1697.5],[8059.856,1697.5]]],["outline","MM5120800U-IY-DB-092",[[5016.812,800.205],[5017.487,800.205],[5017.487,804.55],[5016.812,804.55]]],["tag","TAG-NOT-CLEAR-001","MM5100790U-EG-DB-013"],["tag","TAG-NOT-CLEAR-005","MM5100790U-EG-DB-016"],["tag","TAG-NOT-CLEAR-006","MM5100790U-EG-DB-063"],["tag","TAG-NOT-CLEAR-008","MM5100790U-EG-DB-041"],["tag","TAG-NOT-CLEAR-009","MM5100790U-EG-DB-064"],["tag","TAG-NOT-CLEAR-011","MM5100790U-EG-DB-062"],["tag","TAG-NOT-CLEAR-012","MM5100790U-EG-DB-017"],["tag","TAG-NOT-CLEAR-013","MM5100790U-EG-DB-065"],["tag","TAG-NOT-CLEAR-014","MM51007 /* cubicle: flush door, dark fascia with the designation and a healthy lamp */
#h3{flex:1 0 auto;display:grid;grid-template-columns:minmax(250px,300px) minmax(420px,560px) minmax(0,1fr);gap:14px;padding:14px 18px 22px;min-height:0}
:is(#h3,#h3p,#pjx) .cub{position:relative;background:var(--k-face);border:1px solid var(--k-edge);border-radius:var(--k-rc);box-shadow:var(--k-shc);padding:66px 20px 22px;display:flex;flex-direction:column;gap:18px;min-width:0;overflow:hidden}
:is(#h3,#h3p,#pjx) .np{position:absolute;left:0;right:0;top:0;height:46px;display:flex;align-items:center;gap:10px;padding:0 22px;background:var(--k-glass);color:var(--k-key);box-shadow:inset 0 -1px 0 rgba(255,255,255,.06);font:600 15.5px/1 var(--f-display);letter-spacing:.16em;white-space:nowrap}

:is(#h3,#h3p,#pjx) .lcd{background:var(--k-lcd);border:1px solid var(--k-lcd-edge);border-radius:var(--k-rl);padding:8px 11px;font:500 13.5px/1.62 var(--f-mono);color:var(--k-lcd-ink);min-height:60px;overflow:hidden;box-shadow:var(--k-shl)}

:is(#h3,#h3p,#pjx) .lcd button.ev:focus-visible{background:rgba(255,255,255,.12)}@media (hover:hover) and (pointer:fine){:is(#h3,#h3p,#pjx) .lcd button.ev:hover{background:rgba(255,255,255,.12)}}:is(#h3,#h3p,#pjx) .lcd button.ev.prs{background:rgba(255,255,255,.12);transition-duration:0s}
:is(#h3,#h3p,#pjx) .lcd .r span,:is(#h3,#h3p,#pjx) .lcd button.ev .m{overflow:hidden;text-overflow:ellipsis;color:var(--k-lcd-dim)}
:is(#h3,#h3p,#pjx) .lcd .r b,:is(#h3,#h3p,#pjx) .lcd button.ev b{font-weight:700;color:var(--k-lcd-ink)}
:is(#h3,#h3p,#pjx) .leds{display:flex;flex-direction:column;gap:8px;padding-top:9px}
:is(#h3,#h3p,#pjx) .leds i{width:7px;height:7px;border-radius:50%;background:#565c62;box-shadow:inset 0 1px 1px rgba(0,0,0,.45)}
:is(#h3,#h3p,#pjx) .leds i.g{background:var(--k-g);box-shadow:0 0 0 2px rgba(53,209,90,.22),0 0 8px var(--k-g)}:is(#h3,#h3p,#pjx) .leds i.a{background:var(--k-a);box-shadow:0 0 0 2px rgba(255,179,0,.22),0 0 8px var(--k-a)}:is(#h3,#h3p,#pjx) .leds i.r{background:var(--k-r);box-shadow:0 0 0 2px rgba(255,59,48,.22),0 0 8px var(--k-r)}
:is(#h3,#h3p,#pjx) .leds i.w{background:var(--k-w);box-shadow:0 0 0 2px color-mix(in srgb,var(--k-w) 22%,transparent),0 0 8px var(--k-w)}:is(#h3,#h3p,#pjx) .leds i.b{background:var(--k-b);box-shadow:0 0 0 2px color-mix(in srgb,var(--k-b) 22%,transparent),0 0 8px var(--k-b)}
/* the key in a box: the look of the page keys without the red line (design A, 22-Nov-2026). The line is the colour of the key; on a key
   that switches (Edit mode, Night) it is lit when the key is on. Section 01 of Home: six keys, Online backups a seventh across the bottom */
:is(#h3,#h3p,#pjx) .ctl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;background:var(--k-ied);border-radius:var(--k-ri);padding:12px;box-shadow:var(--k-shi);min-width:0}

:is(#h3,#h3p,#pjx) .ck[hidden]{display:none}
:is(#h3,#h3p,#pjx) .ck i{flex:none;width:26px;height:4px;border-radius:2px;background:var(--lc);box-shadow:0 0 0 2.5px color-mix(in srgb,var(--lc) 24%,transparent)}
:is(#h3,#h3p,#pjx) .ck[aria-checked=false] i{background:#4b5157;box-shadow:none}
:is(#h3,#h3p,#pjx) .ck svg{flex:none;width:26px;height:26px;margin-top:6px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
:is(#h3,#h3p,#pjx) .ck span{margin-top:4px;max-width:100%;font:700 13.5px/1.05 var(--f-display);letter-spacing:.8px;text-transform:uppercase;text-align:center} /* one line with the program's font; with a wider one a name takes two lines and its row grows */
:is(#h3,#h3p,#pjx) .ck:focus-visible{background:var(--k-key);box-shadow:inset 0 0 0 1px var(--k-key);color:var(--k-key-ink)}@media (hover:hover) and (pointer:fine){:is(#h3,#h3p,#pjx) .ck:hover{background:var(--k-key);box-shadow:inset 0 0 0 1px var(--k-key);color:var(--k-key-ink)}}:is(#h3,#h3p,#pjx) .ck.prs{background:var(--k-key);box-shadow:inset 0 0 0 1px var(--k-key);color:var(--k-key-ink);transition-duration:0s}
#h3 .ck[data-h3=load]{--lc:#35d15a}#h3 .ck[data-h3=export]{--lc:#3b9bff}#h3 .ck[data-h3=backup]{--lc:#ffb300}#h3 .ck[data-h3=edit]{--lc:#fff}#h3 .ck[data-h3=theme]{--lc:#8ab4ff}#h3 .ck[data-h3=online]{--lc:#2ec4b6;grid-column:1/-1}
/* the same key on the Projects page and in the Add project window: Open / Switch and Load Excel green, Add project and Template blue,

:is(#h3p,#pjx) .ck:is([data-pj=open],[data-pjx=load]){--lc:#35d15a}:is(#h3p,#pjx) .ck:is([data-pj=add],[data-pjx=tpl]){--lc:#3b9bff}

   The build gives every :active look to a pressed thing (.prs), so a finger gets it too */
:is(#h3,#h3p,#pjx) .ck:active,#h3 .h3gk:active{transform:scale(.97)}:is(#h3,#h3p,#pjx) .ck.prs,#h3 .h3gk.prs{transform:scale(.97);transition-duration:0s}#h3 .brk:active{transform:scale(.97);transform-origin:50% 0}#h3 .brk.prs{transform:scale(.97);transform-origin:50% 0;transition-duration:0s}
/* alerts: a data screen in the design of the Status sheet (Omar, 23-Nov-2026; before: design B, a button with the count at the right of
   every line – it made a line 42 px high on a phone, the Status sheet's is 22). A line is a name and its count, pressed as a whole: it is
   a line of the glass like one of the updates log (.lcd button.ev above). In the column of lights one light for a line, at the height of
   its line: a light of 7 px in a row of the glass (13.5 px x 1.62) */
#h3an .leds{gap:0}#h3an .leds i{margin:calc((13.5px*1.62 - 7px)/2) 0}

#h3 .mim{grid-column:1/-1;position:relative;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:18px 36px;background:var(--k-ied);border-radius:var(--k-ri);padding:22px 28px 14px;box-shadow:var(--k-shi);min-width:0}

#h3 .mim:before{top:15px;height:14px;border-radius:7px;background:rgba(255,69,58,.22)} /* the soft band around the bus */
#h3 .mim:after{top:19.5px;height:5px;border-radius:2.5px;background:#ff453a}           /* the bus */
#h3 .brk{all:unset;box-sizing:border-box;position:relative;cursor:pointer;height:90px;min-width:0;display:flex;flex-direction:column;align-items:center;padding-top:16px;border-radius:0 0 14px 14px;background:#1d2226;box-shadow:inset 0 0 0 1px rgba(255,255,255,.16);color:#f4f6f5;transition:background .18s var(--mo-ease),color .18s,box-shadow .18s,transform .14s var(--mo-ease)}
#h3 .brk:before{content:"";position:absolute;left:50%;top:-4.6px;width:9.2px;height:9.2px;margin-left:-4.6px;border-radius:50%;background:#ffd9d6;z-index:2} /* where the key meets the bus */

#h3 .brk svg{flex:none;width:31px;height:31px;margin-top:7px;fill:none;stroke:currentColor;stroke-width:1.36;stroke-linecap:round;stroke-linejoin:round}
#h3 .brk span{margin-top:4px;font:700 18px/1 var(--f-display);letter-spacing:1.1px;text-transform:uppercase;white-space:nowrap}
#h3 .brk:focus-visible{background:var(--k-key);box-shadow:inset 0 0 0 1px var(--k-key);color:var(--k-key-ink)}@media (hover:hover) and (pointer:fine){#h3 .brk:hover{background:var(--k-key);box-shadow:inset 0 0 0 1px var(--k-key);color:var(--k-key-ink)}}#h3 .brk.prs{background:var(--k-key);box-shadow:inset 0 0 0 1px var(--k-key);color:var(--k-key-ink);transition-duration:0s}

#h3 .sm{display:flex;flex-direction:column;align-items:center;gap:7px;min-width:0;text-align:center}
#h3 .sm svg{width:100%;max-width:158px;aspect-ratio:1;border-radius:20px;box-shadow:0 16px 20px -14px rgba(0,0,0,.75)}
#h3 .sm .nm{font:600 14px/1.15 var(--f-display);letter-spacing:.07em;text-transform:uppercase;color:var(--k-ink);white-space:normal;min-height:2.3em;display:flex;align-items:flex-start;justify-content:center}
#h3 .sm .rd{font:500 12px/1.3 var(--f-mono);color:var(--k-mut);white-space:normal}
body:is(.h3nt,.pres) #h3 .sm .rd{color:var(--k-ink)}
body.pres #h3 [data-h3="theme"]{pointer-events:none;opacity:.45} /* presentation mode is the dark view; the Night key has nothing to switch */

#h3 .hmi{flex:1 1 0;min-height:360px;display:flex;flex-direction:column;background:var(--k-ied);border-radius:var(--k-ri);padding:9px;box-shadow:var(--k-shi)}
#h3 .hmi .hh{display:flex;justify-content:space-between;align-items:center;padding:3px 6px 9px;font:600 12.5px/1 var(--f-display);letter-spacing:.15em;color:var(--k-ied-ink);text-transform:uppercase}

#h3 #h2map{flex:1;display:block;width:100%;min-height:220px;height:auto;padding:0;border:0;border-radius:var(--k-rl);overflow:hidden;background:#0d1520;position:relative}

#h3 .h3gk svg{flex:none;width:25px;height:25px;fill:none;stroke:currentColor;stroke-width:1.68;stroke-linecap:round;stroke-linejoin:round}
#h3 .h3gk:focus-visible{background:var(--k-key);box-shadow:inset 0 0 0 1px var(--k-key);color:var(--k-key-ink)}@media (hover:hover) and (pointer:fine){#h3 .h3gk:hover{background:var(--k-key);box-shadow:inset 0 0 0 1px var(--k-key);color:var(--k-key-ink)}}#h3 .h3gk.prs{background:var(--k-key);box-shadow:inset 0 0 0 1px var(--k-key);color:var(--k-key-ink);transition-duration:0s}

/* ===== Skin 4 · every page inside the program: flush panels on the room, dark title tags, plates, green LCD fields ===== */
/* room, header strip */
.ovl.rep{background:var(--k-room);color:var(--k-ink)}
.ovl.rep .rbar{background:var(--k-face);border-bottom:1px solid var(--k-edge);box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 8px 16px -12px rgba(22,26,30,.5);color:var(--k-ink)}
body:is(.h3nt,.pres) .ovl.rep .rbar{box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 8px 16px -10px rgba(0,0,0,.7)}
.ovl.rep .rbar h1{flex:0 0 auto;margin:0 auto 0 0!important;background:var(--k-glass);color:var(--k-key);border:1px solid var(--k-dark);border-radius:var(--k-rp);padding:7px 20px 6px;font:700 17px/1.1 var(--f-display)!important;letter-spacing:.15em!important;text-transform:uppercase}
/* every button is a plate; the main action is a dark plate */
.ovl.rep .btn{background:var(--k-plate);color:var(--k-plate-ink);border:1px solid var(--k-plate-edge);border-radius:var(--k-rp)!important;font:600 13.5px/1 var(--f-display);letter-spacing:.08em;text-transform:uppercase;box-shadow:var(--k-shp);transition:background .15s,box-shadow .15s var(--mo-ease),transform .08s}
@media (hover:hover) and (pointer:fine){.ovl.rep .btn:hover{background:#fff;border-color:rgba(22,26,30,.6)}}.ovl.rep .btn.prs{background:#fff;border-color:rgba(22,26,30,.6);transition-duration:0s}
.ovl.rep .btn.primary,.ovl.rep .btn.pri{background:var(--k-ied);color:#fff;border-color:var(--k-dark);box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 2px 5px rgba(0,0,0,.25)}
@media (hover:hover) and (pointer:fine){.ovl.rep .btn.primary:hover,.ovl.rep .btn.pri:hover{background:var(--k-ied);filter:brightness(1.18)}}.ovl.rep .btn.primary.prs,.ovl.rep .btn.pri.prs{background:var(--k-ied);filter:brightness(1.18);transition-duration:0s}
/* every field is the same green LCD as the readouts */
.ovl.rep input[type=search],.ovl.rep input[type=text],.ovl.rep input[type=number],.ovl.rep input[type=date],.ovl.rep input[type=month],.ovl.rep select,.ovl.rep textarea,#info input[type=number],#info input[type=text],#info select{background:var(--k-lcd)!important;color:var(--k-lcd-ink)!important;border:1px solid var(--k-lcd-edge)!important;border-radius:var(--k-rl)!important;font-family:var(--f-mono)!important;font-weight:700;box-shadow:var(--k-shl)!important}
.ovl.rep input::placeholder,#info input::placeholder{color:var(--k-lcd-dim);opacity:.75}
.ovl.rep input:focus,.ovl.rep select:focus,.ovl.rep textarea:focus{outline:2px solid var(--k-g)!important;outline-offset:1px}
.ovl.rep .sec>h2:not(:first-child){margin-top:18px!important}
/* side list = a narrow panel; groups are coloured tags, items are plates with a lamp */
.ovl.rep .navbox{background:var(--k-face);border-right:1px solid var(--k-edge)!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.9),10px 0 18px -16px rgba(22,26,30,.55)!important}
body:is(.h3nt,.pres) .ovl.rep .navbox{box-shadow:inset 0 1px 0 rgba(255,255,255,.07),10px 0 18px -16px rgba(0,0,0,.7)!important}
.ovl.rep .navtools{border-bottom:1px solid var(--k-edge)}
.ovl.rep .navtools .nvl,.ovl.rep .navtools span{font:600 12.5px/1 var(--f-display);letter-spacing:.16em;color:var(--k-mut)}
.ovl.rep .navtools button{background:var(--k-plate);border:1px solid var(--k-plate-edge);border-radius:var(--k-rp);color:var(--k-plate-ink);box-shadow:var(--k-shp)}
.ovl.rep .lnh{width:max-content;margin:16px 0 7px 14px!important;padding:5px 11px 4px!important;background:var(--lc,#5d6872);color:#fff!important;border:0;border-radius:var(--k-rp);font:600 12.5px/1 var(--f-display)!important;letter-spacing:.15em!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 1px 2px rgba(0,0,0,.28)}
.ovl.rep .lnh i,.ovl.rep .lnh:before{display:none!important}
.ovl.rep .rnav{position:relative;margin:5px 12px;padding:9px 12px 8px 30px!important;background:var(--k-plate2)!important;border:1px solid var(--k-plate-edge)!important;border-radius:var(--k-rp)!important;box-shadow:var(--k-shp)!important;color:var(--k-plate-ink);--warn:#b71c1c;transition:background .15s,box-shadow .15s var(--mo-ease)}
.ovl.rep .rnav:before{content:"";position:absolute;left:12px;top:50%;width:7px;height:7px;margin-top:-3.5px;border-radius:50%;background:#8b9196;box-shadow:inset 0 1px 1px rgba(0,0,0,.3)}
@media (hover:hover) and (pointer:fine){.ovl.rep .rnav:hover{background:var(--k-plate)!important}}.ovl.rep .rnav.prs{background:var(--k-plate)!important;transition-duration:0s}
.ovl.rep .rnav.on{background:#fff!important;box-shadow:var(--k-on)!important}
.ovl.rep .rnav.on:before{background:var(--k-g);box-shadow:0 0 0 2.5px rgba(53,209,90,.22),0 0 8px var(--k-g)}
.ovl.rep .rnav b{font:600 14.5px/1.2 var(--f-display);letter-spacing:.06em;text-transform:uppercase;color:var(--k-plate-ink)}
.ovl.rep .rnav span{font:11px var(--f-mono);color:#5d636a}
/* every section is a flush panel with a dark title tag */
.ovl.rep .sec{background:var(--k-face)!important;border:1px solid var(--k-edge)!important;border-radius:var(--k-rc)!important;box-shadow:var(--k-shc)!important;padding:22px 24px 24px!important;margin-bottom:22px}
.ovl.rep .sec>h2,.ovl.rep .sec>details>summary h2,.ovl.rep .dech h2,.ovl.rep .ctab2>h2,.ovl.rep .ctab2 h3{display:inline-block;background:var(--k-glass);color:var(--k-key);border:1px solid var(--k-dark);border-radius:var(--k-rp);padding:6px 16px 5px;font:700 15px/1.2 var(--f-display)!important;letter-spacing:.13em!important;text-transform:uppercase;margin:0 0 16px!important}
.ovl.rep .sec h3{font:600 13px/1.2 var(--f-display);letter-spacing:.12em;text-transform:uppercase;color:var(--k-mut)}
/* KPI = relay readout: black frame, lamp in the group colour, green LCD figure */
.ovl.rep .kc{background:var(--k-ied)!important;border:0!important;border-radius:var(--k-ri)!important;padding:12px 14px 13px!important;box-shadow:var(--k-shi)!important;color:#c9d1d7}
.ovl.rep .kc .t,.ovl.rep .kc .kt{font:600 12.5px/1 var(--f-display)!important;letter-spacing:.15em!important;text-transform:uppercase;color:var(--k-ied-ink)!important}
.ovl.rep .kc .t:before,.ovl.rep .kc .kt:before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--c,var(--k-g));margin-right:8px;vertical-align:1px;box-shadow:0 0 7px var(--c,var(--k-g))}
.ovl.rep .kc .v,.ovl.rep .kc .kv,.ovl.rep .kc .kv2{display:block;margin-top:9px;background:var(--k-lcd);border:1px solid var(--k-lcd-edge);border-radius:var(--k-rl);padding:5px 12px;color:var(--k-lcd-ink)!important;font:700 27px/1.15 var(--f-mono)!important;text-align:right;box-shadow:var(--k-shl)}
.ovl.rep .kc .v small,.ovl.rep .kc .v span,.ovl.rep .kc .kv2 small{font-size:12px;color:var(--k-lcd-ink)}
.ovl.rep .kc .r,.ovl.rep .kc .s,.ovl.rep .kc .ks{color:var(--k-glass-mut)!important;font:500 12.5px/1.3 var(--f-body);margin-top:6px}
.ovl.rep .kc .pb{background:#14171a!important;border:0;border-radius:3px!important;height:5px;margin:10px 0 7px}
.ovl.rep .kc .pb i{border-radius:3px}
/* tables: dark header strip; rows stay readable */
.ovl.rep table{background:#fdfdfb}
.ovl.rep th{background:var(--k-dark)!important;color:#dfe5ea!important;font:600 13px/1.2 var(--f-display)!important;letter-spacing:.13em!important;border-bottom:0!important;box-shadow:1px 0 0 var(--k-dark)}
.ovl.rep td{border-color:#e4e6e2;font-size:13px}
@media (hover:hover) and (pointer:fine){.ovl.rep tbody tr:hover td{background:#f1f2ec}}.ovl.rep tbody tr.prs td{background:#f1f2ec;transition-duration:0s}
/* document cards and chart frames are plates on the panel */
.ovl.rep .lc,.ovl.rep .dc,.ovl.rep .dcard,.ovl.rep .cbox,.ovl.rep .ctab2,.ovl.rep .pa,.ovl.rep .decr{background:var(--k-plate)!important;border:1px solid var(--k-plate-edge)!important;border-radius:var(--k-rl)!important;box-shadow:var(--k-shp)!important}
@media (hover:hover) and (pointer:fine){.ovl.rep .lc:hover,.ovl.rep .dc:hover{box-shadow:var(--k-on)!important}}.ovl.rep .lc.prs,.ovl.rep .dc.prs{box-shadow:var(--k-on)!important;transition-duration:0s}
.ovl.rep .pan{border-radius:6px}
.ovl.rep .meta{font:500 12px/1.4 var(--f-mono);color:var(--k-mut);letter-spacing:.02em}
/* tabs that sit on the room (print page): light at night */
body:is(.h3nt,.pres) .ovl.rep .ptabs{border-bottom-color:var(--k-edge)}body:is(.h3nt,.pres) .ovl.rep .ptabs button{color:var(--k-mut)}body:is(.h3nt,.pres) .ovl.rep .ptabs button[aria-selected=true]{color:var(--k-ink);box-shadow:inset 0 -3px 0 var(--k-ink)}
/* section tabs inside a page (areas, filters): small keys */
.ovl.rep .seg button,.ovl.rep .chip,.ovl.rep .chipbtn{border-radius:var(--k-rp)!important;font:600 12.5px/1.2 var(--f-display);letter-spacing:.08em;text-transform:uppercase}
/* ===== Skin 4 · site weather: an LCD window at the right end of the top bar; a click opens its panel ===== */
/* the block sits on the bar's glass; its left 16px fade out, so tabs that scroll under it end softly */
#wxw{position:fixed;top:0;right:0;height:39px;z-index:59;display:flex;align-items:center;padding:0 14px 0 26px;box-sizing:border-box;background:linear-gradient(180deg,#22272c,#131619);-webkit-mask-image:linear-gradient(90deg,transparent,#000 16px);mask-image:linear-gradient(90deg,transparent,#000 16px)}
#tbar{padding-right:calc(14px + var(--wxw,0px))} /* the tabs end where the readout begins; without a forecast the bar is as it was */
#wx{height:28px;display:flex;align-items:center;gap:7px;margin:0;padding:0 11px 0 9px;border:1px solid var(--k-lcd-edge);border-radius:8px;background:var(--k-lcd);color:var(--k-lcd-ink);box-shadow:var(--k-shl);font:600 13.5px/1 var(--f-mono);white-space:nowrap;cursor:pointer}
#wx svg{flex:none}
#wx b{font-weight:700}
#wx .wxwd{display:flex;align-items:center;gap:7px}
#wx .wxsep{width:1px;height:14px;background:rgba(16,36,12,.38);margin:0 4px}
#wx.old{color:var(--k-lcd-dim)}
#wx .wxlamp{flex:none;margin:0 2px 0 1px} /* the lamp itself is the TODAY strip's red lamp (05-02-skin-home.css) */
.wxup{text-transform:uppercase}
/* panel: hangs under the readout like the + menu */
#wxp{position:fixed;top:40px;right:14px;z-index:400;width:300px;max-width:calc(100vw - 16px);box-sizing:border-box;background:var(--k-ied);color:var(--k-glass-ink);border-radius:0 0 var(--k-ri) var(--k-ri);box-shadow:var(--k-shf);padding:13px 12px 11px}
#wxp .wxh{display:flex;justify-content:space-between;align-items:center;margin:0 2px 10px}
#wxp .wxt{font:600 12.5px/1 var(--f-display);letter-spacing:.15em;text-transform:uppercase;color:var(--k-ied-ink)}
#wxp .wxtag{font:600 11px/1 var(--f-display);letter-spacing:.12em;text-transform:uppercase;color:var(--k-dark);background:var(--k-a);border-radius:5px;padding:4px 7px 3px}
#wxp .wxtag.old{background:var(--k-r)}
#wxp .wxlcd{background:var(--k-lcd);color:var(--k-lcd-ink);border:1px solid var(--k-lcd-edge);border-radius:10px;box-shadow:var(--k-shl);padding:8px 12px;font:500 13.5px/1.8 var(--f-mono)}
#wxp .wxlcd div{display:flex;justify-content:space-between;gap:12px}
#wxp .wxlcd span{text-transform:uppercase}
#wxp .wxlcd b{font-weight:700}
#wxp .wxhr{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}
#wxp .wxhr div{background:var(--k-tile);border-radius:9px;padding:8px 0 7px;text-align:center}
#wxp .wxhr i{display:block;font:600 11.5px/1 var(--f-display);letter-spacing:.1em;color:var(--k-tile-ink);font-style:normal}
#wxp .wxhr b{display:block;margin-top:6px;font:600 17px/1 var(--f-display);color:#fff}
#wxp .wxhr u{display:block;margin-top:5px;font:500 11.5px/1 var(--f-mono);color:var(--k-glass-mut);text-decoration:none}
#wxp .wxdy{margin-top:10px;border-top:1px solid rgba(255,255,255,.09)}
#wxp .wxdy div{display:grid;grid-template-columns:62px 1fr auto;align-items:center;padding:9px 2px 8px;border-bottom:1px solid rgba(255,255,255,.09);font:600 13px/1 var(--f-display);letter-spacing:.07em}
#wxp .wxdy span{color:var(--k-glass-mut);text-transform:uppercase}
#wxp .wxdy b{color:#fff;font-weight:600}
#wxp .wxdy u{text-decoration:none;color:var(--k-glass-mut);font:500 12px/1 var(--f-mono);letter-spacing:0}
#wxp .wxft{margin:9px 2px 0;font:500 11px/1.3 var(--f-body);color:var(--k-tile-ink);overflow-wrap:anywhere}
@media(max-width:349px){#wx .wxwd{display:none}} /* a very narrow phone keeps the temperature only, so the readout stays off the + key */

/* Layout: control-room split — work lists on the left, live site map on the right; stacks on phones */
:root{ color-scheme:light;
  --inst:#2a8c55; --yard:#e3a00d; --cast:#607d8b; --nc:#8e24aa; --unk:#9aa3ab;
  --tr-r:#43a047; --tr-y:#ffb400;
  --map-bg:#ffffff; --map-road:#e4e7e9; --map-net:#c3c8cc; --map-bld:#ece6dc; --map-bld-line:#b3a899; --map-name:#a56a42; --map-found:#97a2af; --map-pit:#7d8894; --map-minor:#d3ccc3;
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,Segoe UI,Arial,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px;}
h1,h2,h3{font-family:var(--f-display);font-weight:700;letter-spacing:.01em;margin:0;text-wrap:balance}
.mono,td.num,.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
button,input,select,label.btn{font:inherit}
.top{flex-wrap:wrap;justify-content:space-between}
.brand h1{line-height:1}
.brand .sub{color:var(--muted);margin-top:4px}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);color:var(--ink);
  padding:7px 12px;border-radius:6px;cursor:pointer;font-weight:600}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn:focus-visible,input:focus-visible,select:focus-visible,.tab:focus-visible,tr[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input[type=search]{border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:7px 10px;border-radius:6px;max-width:100%}
.asof{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-bottom:12px}
.kpi{background:var(--panel);border:1px solid var(--line);padding:10px 12px;display:flex;flex-direction:column;gap:2px;border-left:5px solid var(--c,var(--line))}
.kpi .v{font-family:var(--f-display);font-size:28px;font-weight:700;line-height:1}
.kpi .l{font-size:11px;text-transform:uppercase;color:var(--muted)}
.kpi .s{font-size:12px;color:var(--muted);font-family:var(--f-mono)}
.main{display:grid;grid-template-columns:minmax(0,var(--lw,470px)) 12px minmax(0,1fr);height:var(--mh,760px);min-height:320px}
.main>.panel{min-height:0;overflow:hidden}
@media (max-width:980px){.main{grid-template-columns:minmax(0,1fr);height:auto}.split{display:none}.mapwrap{min-height:520px}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;min-width:0;display:flex;flex-direction:column}
.tabs{display:flex;flex-wrap:wrap;gap:2px;padding:6px;border-bottom:1px solid var(--line)}
.tab{border:0;background:transparent;color:var(--muted);cursor:pointer;font-family:var(--f-display);font-weight:600}
.tab[aria-selected=true]{background:var(--accent);color:var(--accent-ink)}
.tab .cnt{font-family:var(--f-mono);font-size:11px;opacity:.85;margin-left:4px}
.view{padding:12px;overflow:auto;flex:1;min-height:0}
@media (max-width:980px){.view{max-height:none}}
.view p.lead{margin:0 0 10px;color:var(--muted);font-size:13px;max-width:62ch}
table{width:100%;border-collapse:collapse;font-size:13px}
th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:left;font-weight:600;padding:6px 6px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel)}
td{padding:6px;border-bottom:1px solid var(--line);vertical-align:top}
td.num,th.num{text-align:right}
tr[tabindex]{cursor:pointer}
@media (hover:hover) and (pointer:fine){tr[tabindex]:hover td{background:var(--soft)}}tr[tabindex].prs td{background:var(--soft);transition-duration:0s}
tr.sel td{background:color-mix(in srgb,var(--accent) 14%,transparent)}
.bar{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--soft);margin-top:4px;min-width:90px}
.bar span{display:block;height:100%}
.pill{display:inline-block;font-size:11px;font-weight:600;padding:1px 7px;border-radius:999px;border:1px solid currentColor;white-space:nowrap}
.p-Installed{color:var(--inst)} .p-Precast{color:var(--yard)} .p-Casted{color:var(--cast)} .p-Not{color:var(--nc)} .p-Unknown{color:var(--unk)}
.ready{font-family:var(--f-display);font-size:20px;font-weight:700}
.group{border:1px solid var(--line);border-radius:6px;margin-bottom:10px}
.group > summary{cursor:pointer;padding:8px 10px;display:flex;flex-wrap:wrap;gap:6px 12px;align-items:baseline;list-style:none}
.group > summary::-webkit-details-marker{display:none}
.group > summary h3{font-size:17px}
.group .body{padding:0 10px 10px}
.tags{display:flex;flex-wrap:wrap;gap:4px}
.tag{font-family:var(--f-mono);font-size:11.5px;padding:2px 6px;border-radius:4px;background:var(--soft);border:1px solid var(--line);cursor:pointer;color:var(--ink)}
@media (hover:hover) and (pointer:fine){.tag:hover{border-color:var(--accent)}}.tag.prs{border-color:var(--accent);transition-duration:0s}
.muted{color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.chk{display:inline-flex;gap:6px;align-items:center;font-size:13px;color:var(--muted)}
.mapwrap{position:relative;min-height:0;flex:1}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;border-radius:0 0 8px 8px;background:var(--map-bg);touch-action:none}

}/* One motion system (Nov-2026): pages 220 ms, content 180 ms, pop-ups 180 ms, one easing, no bounce */
:root{--mo-ease:cubic-bezier(.22,.8,.24,1);--mo-page:220ms;--mo-content:180ms;--mo-pop:180ms}
@keyframes moPage{from{opacity:0;transform:translate3d(0,8px,0)}to{opacity:1;transform:none}}
@keyframes moContent{from{opacity:0;transform:translate3d(0,4px,0)}to{opacity:1;transform:none}}
@keyframes moPop{from{opacity:0;transform:translate3d(0,6px,0) scale(.985)}to{opacity:1;transform:none}}
@keyframes moToast{from{opacity:0;transform:translate3d(-50%,6px,0)}to{opacity:1;transform:translate3d(-50%,0,0)}}
@keyframes moFade{from{opacity:0}to{opacity:1}}
.ovl:not([hidden]),.mo-page{animation:moPage var(--mo-page) var(--mo-ease) backwards!important}
.mo-content,.view.anim,details.group[open]>.body{animation:moContent var(--mo-content) var(--mo-ease) backwards!important}
.pop:not([hidden]),.edit:not([hidden]),details[open]>.menu,.info:not([hidden]),.addmenu:not([hidden]),.icpick:not([hidden]),.gfpan:not([hidden]),.mpbar:not([hidden]),.nwpop:not([hidden]),.mdlbg:not([hidden]) .mdlbox{animation:moPop var(--mo-pop) var(--mo-ease) backwards!important}
body .toast:not([hidden]){animation:moToast var(--mo-pop) var(--mo-ease) backwards!important}
body .toast{z-index:100} /* toasts were hidden behind open pages (z 20 < 60) */
.mdlbg:not([hidden]),#aqv:not([hidden]),#printroot:not([hidden]){animation:moFade var(--mo-pop) var(--mo-ease) backwards!important}
body.mapfull .main>.panel:first-child{transition:transform var(--mo-page) var(--mo-ease)!important}
